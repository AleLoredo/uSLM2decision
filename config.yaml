# OpenJEV General Configuration
# Archivo central de configuración del motor de decisiones

# Modo de ejecución:
# - "mock": Inferencia simulada para pruebas unitarias y CI ultrarrápidas (sin carga de pesos).
# - "real": Inferencia no autorregresiva real sobre Metal GPU / PyTorch con backbone y cabezales.
mode: real

model:
  base_dir: ./models
  active_model: openelm-450m
  backbone_path: ./models/openelm-450m
  heads_path: ./models/openelm-450m/heads.safetensors
  calibration_path: ./models/openelm-450m/calibration.json
  backend: mlx
  device: auto

server:
  host: 0.0.0.0
  port: 8000
  
  # Seguridad y Control de Acceso (Autenticación Bearer token)
  auth:
    enabled: false
    api_keys:
      - env:OPENJEV_API_KEY
      - openjev-local-dev-key

  # Limitación de Tasa Standalone para despliegues en el borde sin API Gateway (Algoritmo Token Bucket)
  rate_limit:
    enabled: false
    max_burst: 50
    requests_per_second: 20

  # Control de Admisión de Hardware y Descarte de Carga (Protección de memoria y GPU)
  admission:
    max_queue_depth: 2048
    max_active_tokens: 16384
    retry_after_seconds: 2

  # Dynamic Micro-Batching y Despachador Concurrente para Inferencia
  batching:
    enabled: true
    max_batch_size: 16
    max_wait_ms: 8
    max_queue_depth: 2048



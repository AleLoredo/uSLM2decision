[workspace]
members = [
    "crates/core",
    "crates/calibration",
    "crates/engine-mlx",
    "crates/api"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["OpenJEV Authors"]
license = "Apache-2.0"
repository = "https://github.com/OpenJEV/OpenJEV"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util", "timeout", "load-shed"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
rayon = "1.10"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
safetensors = "0.4"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
governor = "0.6"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
criterion = "0.5"

openjev-core = { path = "crates/core" }
openjev-calibration = { path = "crates/calibration" }
openjev-engine = { path = "crates/engine-mlx" }
openjev-api = { path = "crates/api" }

[package]
name = "openjev-mlx"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

openjev-core.workspace = true
openjev-calibration.workspace = true
openjev-engine.workspace = true
openjev-api.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "decide_latency"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

